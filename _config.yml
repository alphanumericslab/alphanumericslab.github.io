# ---------------------------------------------------------------------------
# sameni.org — The Alphanumerics Lab
# Self-contained layout (no external theme). Built and deployed by
# .github/workflows/jekyll.yml; also builds with the classic Pages builder.
# ---------------------------------------------------------------------------

title: The Alphanumerics Lab
tagline: From data to models, algorithms, decisions and beyond....
affiliation: Emory University BMI | Georgia Tech BME
description: >-
  The Alphanumerics Lab at Emory University and Georgia Tech develops
  biomedical signal processing, machine learning and AI methods for
  healthcare, with open-source tools and data.
lang: en

# Custom domain. The CNAME file in the repo root must keep saying "sameni.org".
url: "https://sameni.org"
baseurl: ""

author:
  name: Reza Sameni
  email: rsameni@dbmi.emory.edu

# Structured data for search engines (jekyll-seo-tag).
social:
  name: The Alphanumerics Lab
  links:
    - "https://github.com/alphanumericslab"
    - "https://sameni.info"

# ---------------------------------------------------------------------------
# Header menu, in this order. A page's `menu_title` (if set) is shown instead
# of its `title` (e.g. about.md is titled "Lab Manual" but listed as "About").
# ---------------------------------------------------------------------------
header_pages:
  - projects.md
  - publications.md
  - codes.md
  - team.md
  - about.md
  - jobs.md

# ---------------------------------------------------------------------------
# Footer links. `icon` must be one of: mail, github, scholar, person, linkedin
# ---------------------------------------------------------------------------
social_links:
  - { label: "Email",                  icon: mail,    url: "mailto:rsameni@dbmi.emory.edu" }
  - { label: "GitHub",                 icon: github,  url: "https://github.com/alphanumericslab" }
  - { label: "Google Scholar",         icon: scholar, url: "https://scholar.google.com/citations?user=MkoXtWwAAAAJ" }
  - { label: "Lab director's homepage", icon: person, url: "https://sameni.info" }

# Google Analytics: set a GA4 ID ("G-XXXXXXX") to enable. Leave empty to disable.
google_analytics:

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-sitemap

# Never list CNAME here — it has to be copied into the built site.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .editorconfig
  - .jekyll-cache/
  - .sass-cache/
  - vendor/
  - node_modules/
