<footer class="site-footer">
  <div class="wrapper site-footer-row">
    <div class="site-footer-text">
      <p class="site-footer-name">&copy; {{ site.time | date: '%Y' }} {{ site.title | escape }}</p>
      {%- if site.affiliation %}
      <p class="site-footer-affiliation">{{ site.affiliation | escape }}</p>
      {%- endif %}
    </div>
    {% include social-links.html class="footer-links" %}
  </div>
</footer>
