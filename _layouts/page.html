---
layout: base
---
<article class="page">
  {%- assign page_title = page.title | strip -%}
  {%- if page_title != "" -%}
  <header class="page-header">
    <h1 class="page-title">{{ page_title | escape }}</h1>
    {%- if page.subtitle %}<p class="page-subtitle">{{ page.subtitle | escape }}</p>{% endif -%}
  </header>
  {%- endif -%}
  <div class="prose">
    {{ content }}
  </div>
</article>
