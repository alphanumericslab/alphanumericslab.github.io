<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Detect &amp; Correct — ECG Lead Swap Demo</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <!--
    Static, self-contained prototype for the poster "Detect and Correct" flow.
    No server round-trips: logic + precomputed case data (data/cases.json) live
    client-side so the page loads once and runs from cache on phone/tablet/laptop.

    Case data is produced by ecg-lead-swapping/codes/website_export/export_cases.py
    (real model outputs on real PTB-XL records). Records are currently RANDOM
    placeholders; swap in curated ones later via export_cases.py --ecg-ids.
  -->
  <div id="app" class="app"></div>

  <script src="./js/ecg.js"></script>
  <script src="./js/bodyDiagram.js"></script>
  <script src="./js/cases.js"></script>
  <script src="./js/app.js"></script>
  <script>
    // Basic offline caching for unreliable conference Wi-Fi. Optional; ignore failures.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
